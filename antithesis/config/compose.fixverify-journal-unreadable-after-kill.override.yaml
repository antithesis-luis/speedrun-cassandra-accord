    image: cassandra-accord-cassandra:e874e3a9-fix-V3
    build:
      args:
        PATCH_SET: fixverify-journal-unreadable-after-kill
  node2:
    image: cassandra-accord-cassandra:e874e3a9-fix-V3
    build:
      args:
        PATCH_SET: fixverify-journal-unreadable-after-kill
  node3:
    image: cassandra-accord-cassandra:e874e3a9-fix-V3
    build:
      args:
        PATCH_SET: fixverify-journal-unreadable-after-kill
